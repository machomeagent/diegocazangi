<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    const LINK_DO_SITE = "https://reflect-mall-boolean-census.trycloudflare.com";
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dr. Diego Cazangi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.08);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 30px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      font-weight: normal;
      color: #cbd5e1;
    }

    p {
      line-height: 1.5;
      color: #cbd5e1;
      font-size: 16px;
    }

    a.botao {
      display: inline-block;
      margin-top: 22px;
      padding: 15px 26px;
      background: #38bdf8;
      color: #020617;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      font-size: 17px;
    }

    a.botao:hover {
      background: #7dd3fc;
    }

    .aviso {
      margin-top: 22px;
      font-size: 13px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Dr. Diego Cazangi</h1>

    <p>

    <p class="aviso">

    </p>

  <script>
    document.getElementById("botaoSite").href = LINK_DO_SITE;
  </script>
</body>
</html>
